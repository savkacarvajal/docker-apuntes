services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASS:?falta DB_PASS en .env}
      MARIADB_DATABASE: tienda
    volumes:
      - datos:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  panel:
    image: adminer
    ports:
      - "127.0.0.1:${PANEL_PORT:-8082}:8080"
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy

  intruso:
    image: alpine
    command: sleep infinity
    networks: [frontend]

networks:
  backend:
  frontend:

volumes:
  datos:
